apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    label.servicename: "mdpBuilder_fg3_d"
    label.gitversion: "datex2mdpBuilder_fg3_D_5.0.5.2"
    app: mdp-builder-fg3
  name: mdp-builder-fg3
  namespace: c2vba
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mdp-builder-fg3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: '8080'
        prometheus.io/scrape: 'true'
      creationTimestamp: null
      labels:
        app: mdp-builder-fg3
    spec:
      containers:
      - name: app
        image: 'heuboe/datex2/mdp/datex2mdp-builder:5.0.5'
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: application-environment
        - secretRef:
            name: mdm-certs-environment
        - secretRef:
            name: publication-version-environment
        env:
        - name: application.name
          value: mdp-builder-fg3
        - name: application.instance
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: info.kubernetes.node.name
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: info.kubernetes.pod.name
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: info.kubernetes.pod.namespace
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: JAVA_TOOL_OPTIONS
          value: '-XX:MaxRAMPercentage=75 -Dde.heuboe.base.directory.cleaner.outdated.interval=4'
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /actuator/health
            port: actuator
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 5
        ports:
        - containerPort: 8080
          name: actuator
          protocol: TCP
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /actuator/health
            port: actuator
            scheme: HTTP
          initialDelaySeconds: 80
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 600Mi
          requests:
            cpu: 100m
            memory: 200Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
          - mountPath: /config
            name: config
          - mountPath: /mdm-certs
            name: mdm-certs
          - mountPath: /files
            name: files
      volumes:
        - configMap:
            defaultMode: 420
            name: mdp-builder-fg3
          name: config
        - configMap:
            defaultMode: 420
            name: mdm-certs
          name: mdm-certs
        - name: files
          persistentVolumeClaim:
            claimName: mdp-fg3-files
