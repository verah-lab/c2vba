apiVersion: v1
kind: Pod
metadata:
  name: parameter-data-initializer
spec:
  containers:
  - name: alpine
    image: alpine:latest
    command: ['sleep', 'infinity']
    volumeMounts:
    - name: parameter-data
      mountPath: /parameter-data
  volumes:
  - name: parameter-data
    hostPath:
      path: parameter-data
