---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: site-config-service
spec:
  port:
    targetPort: actuator
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: site-config-service
