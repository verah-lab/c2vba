---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    label.servicename: "strategic-routing-publication_D"
    label.gitversion: "strategic-routing-publication_D_1.0.4.2"
    app: strategic-routing-publication
    log-type: spring-actuator
  name: strategic-routing-publication
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: strategic-routing-publication
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app: strategic-routing-publication
        log-type: spring-actuator
    spec:
      containers:
      - name: app
        image: heuboe/c2vba/datex2/strategic-routing-publication:1.0.7
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: actuator
          protocol: TCP
        envFrom:
        - secretRef:
            name: application-environment
        - secretRef:
            name: mdm-certs-environment
        env:
        - name: "SPRING_PROFILES_ACTIVE"
          value: "default,${SYSTEM_NAME}-${SYSTEM_STAGE},${SYSTEM_STAGE}"
        - name: application.name
          value: "strategic-routing-publication"
        - name: application.instance
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: "info.kubernetes.node.name"
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: "info.kubernetes.pod.name"
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: "info.kubernetes.pod.namespace"
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: "JAVA_TOOL_OPTIONS"
          value: "-XX:MaxRAMPercentage=75 -Dorg.apache.cxf.stax.maxChildElements=500000"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: mdm-certs
          mountPath: /mdm-certs
        - name: files
          mountPath: /files
        - name: strategie-files
          mountPath: /strategie-files
        resources:
          limits:
            cpu: "500m"
            memory: 1500Mi
          requests:
            cpu: "300m"
            memory: 1500Mi
      volumes:
      - name: config
        configMap:
          name: strategic-routing-publication
      - name: mdm-certs
        configMap:
          name: mdm-certs
      - name: files
        persistentVolumeClaim:
          claimName: srp-files
      - name: strategie-files
        persistentVolumeClaim:
          claimName: strategie-files
