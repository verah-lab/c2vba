# Spring: HTTP access to actuator data
server.port=8080

# MongoDB database connection
spring.data.mongodb.uri=mongodb://${MONGODB_AUTHORITY}/strategy?appName=strategie-matching&authSource=admin


# Configuration: sites (Anlagen) with assigend KRI IDs
de.heuboe.sdbby.service.cfgFilename=config/config.xml

# Port of implemented SOAP service
de.heuboe.sdbby.service.wsPort=8123



##
## Kafka
##

## Connection
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}

# Consumer ID
spring.kafka.consumer.group-id=sdbby-service

# Default serialization types
spring.kafka.consumer.properties.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.properties.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Topics provides state of sites (Anlagen)
de.heuboe.sdbby.service.fehlerTopic=C2VBA-tlsin-SYSFehlerDUE
de.heuboe.sdbby.service.commStatesTopic=C2VBA-CommStates

## --------------------------------------------------------------------------
## Actuator
## --------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoints.web.exposure.exclude=shutdown
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

