---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    label.servicename: "wls-project-sdbby_D"
    label.gitversion: "wls-project-sdbby_D_5.0.8.1"
    app: wls-project-sdbby
    log-type: spring-actuator
  name: wls-project-sdbby
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: wls-project-sdbby
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app: wls-project-sdbby
        log-type: spring-actuator
    spec:
      containers:
      - name: app
        image: heuboe/wls/wls-project-sdbby:5.0.8
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: actuator
          protocol: TCP
        - containerPort: 8085
          name: wls
          protocol: TCP
        - containerPort: 4916
          name: geo
          protocol: TCP
        envFrom:
        - secretRef:
            name: application-environment
        env:
        - name: "SPRING_PROFILES_ACTIVE"
          value: "default,${SYSTEM_NAME}-${SYSTEM_STAGE},${SYSTEM_STAGE}"
        - name: application.name
          value: "wls-project-sdbby"
        - name: application.instance
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: "info.kubernetes.node.name"
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: "info.kubernetes.pod.name"
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: "info.kubernetes.pod.namespace"
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: "JAVA_TOOL_OPTIONS"
          value: "-XX:MaxRAMPercentage=80"
          # value: "-Xmx300M"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: map-data
          mountPath: /map-wls
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /actuator/health
            port: actuator
            scheme: HTTP
          initialDelaySeconds: 3600
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 120
          httpGet:
            path: /ready
            port: actuator
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: "2000m"
            memory: 3500Mi
          requests:
            cpu: "300m"
            memory: 3500Mi
      volumes:
      - name: config
        configMap:
          name: wls-project-sdbby
      - name: map-data
        persistentVolumeClaim:
          claimName: map-data
