---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    label.servicename: "c2vba-datex2-mst-localisation_D"
    label.gitversion: "c2vba-datex2-mst-localisation_D_5.0.5.1"
    app: c2vba-datex2-mst-localisation
    log-type: spring-actuator
  name: c2vba-datex2-mst-localisation
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: c2vba-datex2-mst-localisation
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app: c2vba-datex2-mst-localisation
        log-type: spring-actuator
    spec:
      containers:
      - name: app
        image: heuboe/by/c2vba/c2vba-datex2-mst-localisation:5.0.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: actuator
          protocol: TCP
        - containerPort: 5711
          name: svc
          protocol: TCP
        envFrom:
        - secretRef:
            name: application-environment
        env:
        - name: "SPRING_PROFILES_ACTIVE"
          value: "default,${SYSTEM_NAME}-${SYSTEM_STAGE},${SYSTEM_STAGE}"
        - name: application.name
          value: "c2vba-datex2-mst-localisation"
        - name: application.instance
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: "info.kubernetes.node.name"
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: "info.kubernetes.pod.name"
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: "info.kubernetes.pod.namespace"
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: "JAVA_TOOL_OPTIONS"
          value: "-XX:MaxRAMPercentage=75"
          # value: "-Xmx300M"
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          limits:
            cpu: "1000m"
            memory: 1200Mi
          requests:
            cpu: "300m"
            memory: 1000Mi
      volumes:
      - name: config
        configMap:
          name: c2vba-datex2-mst-localisation
