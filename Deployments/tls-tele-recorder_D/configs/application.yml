## +-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-
##
## tls/tls-tele-recorder
##
## This file provides a list of all custom application properties. The
## properties are listed with a possible default value, a hint which values
## might be allowed and a short description what the properties are used for.
##
## The file is intended as a template for custom property files
## of this application, which are then used in specific environments.
##
## All properties that have no default value or need to be overridden
## can be specified either
##   - within a custom property file ('-Dspring.config.location=file:<path>')
##   - by using system properties (-D<property>=<value>)
##   - application parameters (--<property>=<value>).
##
## See: Spring Boot Reference Guide - Externalized Configuration
## http://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#boot-features-external-config
## +-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-

## --------------------------------------------------------------------------
## Spring Actuator
## --------------------------------------------------------------------------
management:
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        exclude: shutdown
        include: health,info,metrics,prometheus,loggers
  metrics:
    export:
      prometheus:
        enabled: true


## --------------------------------------------------------------------------
## TCP Server configuration
## --------------------------------------------------------------------------
server:
  port: 8080


## --------------------------------------------------------------------------
## Spring Kafka
## --------------------------------------------------------------------------
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    client-id: tls-tele-recorder_${SYSTEM_NAME_UC}
    consumer:
      group-id: tls-tele-recorder_${SYSTEM_NAME_UC}
      properties:
        value:
          deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      topic-pattern: ''
    producer:
      properties:
        value:
          serializer: org.apache.kafka.common.serialization.ByteArraySerializer


## --------------------------------------------------------------------------
## Tele recorder configuration
## --------------------------------------------------------------------------
tls:
  tele:
    recorder:
      # file path for saving log files
      absolutLogPath: /tls-data/tele-recorder/

      # Interval configuration for creating new log files.
      interval:
        # Defines the interval in seconds. Will be overridden by cron configuration.
        static: 3600
        # Defines the interval as cron expression. This will override the interval configuration.
        cron: 0 0 0 * * ?

      # Configuration for log cleaning.
      cleanLogs:
        # Determine the clean log strategy. Depending on this value one of the following parameter will be used.
        # Possible values: number, size, none
        strategy: number
        # Number of telegrams that should be kept (0 means unlimited telegram files).
        number: 20
        # Size in Megabyte that should be kept (0 means unlimited telegram files).
        size: 100

      # Flag that enable a GZIP compression for completed log files. The log files will be deleted after compression.
      # Compressed files will also be deleted due to log cleaning! Default false.
      compressLogs: true

      # Determines the number of max recursive calls of the saveToFile method due to filestream access errors. Default 5.
      maxSaveRetries: 5

      # retries the KafkaOperatorService resends messages to the tele-recorder
      responseRetries: 2

      # the timeout the KafkaOperatorService waits until resends a message to the tele-recorder
      responseTimeout: 10000

      # topic for receiving telegrams
      receiveTopic: ${SYSTEM_PREFIX}-tlsin-TeleReceived

      # topic for sending telegrams
      sendTopic: ${SYSTEM_PREFIX}-tlsout-TeleToSend

      # Define server paths for different functionalities.
      server:
        http:
          # Flag that enables or disables the HTTP server. Default false.
          enabled: false
          path:
            # Path for reading all current saved telegrams.
            readTelegrams: read
            # Path for live streaming telegrams.
            streamTelegrams: stream

        tcp:
          # Flag that enables or disables the TPC server. Default true.
          enabled: false
          # Definition of the TCP port for streaming telegrams.
          port: -1
          # Definition of the TCP port for streaming legacy telegrams.
          legacyPort: -1
