---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    label.servicename: "tls-tele-recorder_D"
    label.gitversion: "c2vba-tls-tele-recorder_D_2.0.1.3"
    app: tls-tele-recorder
    log-type: spring-actuator
  name: tls-tele-recorder
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tls-tele-recorder
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app: tls-tele-recorder
    spec:
      containers:
      - name: app
        image: 'heuboe/tls/tls-tele-recorder:2.0.1'
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: actuator
          protocol: TCP
        envFrom:
          - secretRef:
              name: application-environment
        env:
        - name: application.name
          value: "tls-tele-recorder"
#        - name: SPRING_PROFILES_ACTIVE
#          value: "default"
        - name: application.instance
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: "info.kubernetes.node.name"
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: "info.kubernetes.pod.name"
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: "info.kubernetes.pod.namespace"
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: "JAVA_TOOL_OPTIONS"
          value: "-XX:MaxRAMPercentage=75"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: tls-data
          mountPath: /tls-data
        livenessProbe:
          failureThreshold: 20
          httpGet:
            path: /actuator/health
            port: actuator
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /actuator/health
            port: actuator
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: "400m"
            memory: 850Mi
          requests:
            cpu: "100m"
            memory: 400Mi
      volumes:
      - name: config
        configMap:
          name: tls-tele-recorder
      - name: tls-data
        persistentVolumeClaim:
          claimName: tls-data
