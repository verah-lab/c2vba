apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - image: bitnami/kafka:3.7.0
        name: kafka
        env:
        - name: KAFKA_CFG_ZOOKEEPER_CONNECT
          value: 'zookeeper:2181'
        - name: ALLOW_PLAINTEXT_LISTENER
          value: 'yes'
        - name: KAFKA_HEAP_OPTS
          value: '-Xmx4G -Xms4G'
        volumeMounts:
        - name: kafka-data
          mountPath: /kafka
        - name: kafka-config
          mountPath: /bitnami/kafka/config/server.properties
          subPath: server.properties
        resources:
          limits:
            memory: 6Gi
          requests:
            memory: 6Gi
      initContainers:
        - args:
            - chown 1001 /kafka;
          command:
            - /bin/sh
            - '-c'
          image: alpine:latest
          imagePullPolicy: Always
          name: initcontainer
          volumeMounts:
            - mountPath: /kafka
              name: kafka-data

#        securityContext:
#          runAsUser: 1001
#          runAsGroup: 1001
#          fsGroup: 1001
#          privileged: false
      volumes:
      - name: kafka-data
        persistentVolumeClaim:
          claimName: kafka-data
      - name: kafka-config
        configMap:
          name: kafka-config
