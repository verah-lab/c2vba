server.port=8080

##
## Kafka
##

## Connection
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}

# Consumer group ID
spring.kafka.consumer.group-id=c2vba-datex2-join-sba

# Default serialization types
spring.kafka.consumer.properties.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.properties.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Topics with DATEX-II VMS-Publications
de.heuboe.c2vba.datex2.join.topicSued = C2VBA-datex2-publication-vms-sba-sued
de.heuboe.c2vba.datex2.join.topicNord = C2VBA-datex2-publication-vms-sba-nord


# VMS table ID and version
de.heuboe.c2vba.datex2.join.tableId = D2-C2VBA-SBA-Table
de.heuboe.c2vba.datex2.join.tableVersion = ${NORD-SUED-VMS-SBA-VERSION}

# Interval of additional cyclic snapshot publications
de.heuboe.c2vba.datex2.join.pubInterval= 300

# If the data of a site (Nord or Sued) is outdated (older than 'outdatedInterval' seconds) it is not sent (on cyclic publications)
de.heuboe.c2vba.datex2.join.outdatedInterval= 864000

# Each sent publication is saved as XML file in 'pubFileDir'
de.heuboe.c2vba.datex2.join.pubFileDir = /files/pub

# Logged DATEX-II publication files are deleted after <keepInterval> hours
de.heuboe.c2vba.datex2.join.keepInterval=48



#
# Mobilithek connection parameters
#

de.heuboe.datex2.remote=SOAP
de.heuboe.datex2.vms.status.pub.receiverType=MDM

# Mobilithek communication requires http gzip mode
de.heuboe.datex2.connection.useGzip=true

de.heuboe.datex2.connection.url=${SBA-NORD-SUED-URL}

de.heuboe.datex2.connection.trustStoreFile=/mdm-certs/${MDM_PUBLIC_CERT_FILE}
de.heuboe.datex2.connection.trustStorePassword=${MDM_PUBLIC_CERT_PW}
de.heuboe.datex2.connection.keyStoreFile=/mdm-certs/${SYSTEM_PRIVATE_KEY_FILE}
de.heuboe.datex2.connection.keyStorePassword=${SYSTEM_PRIVATE_KEY_PW}


#de.heuboe.datex2.connection.keyStoreFile=/mdm-certs/mobi.autobahn.certificate.p12
#de.heuboe.datex2.connection.keyStorePassword=61rNFix8zgpM


## --------------------------------------------------------------------------
## Actuator
## --------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoints.web.exposure.exclude=shutdown
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true