server.port=8080


server.servlet.context-path=${SERVER_SERVLET_CONTENT_PATH_FG1_FG3}

##
## Kafka
##

## Connection
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}

# Consumer ID
spring.kafka.consumer.group-id=c2vba-datex2-region-receiver-fg1-fg3

# Default serialization types
spring.kafka.consumer.properties.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.properties.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer


de.heuboe.datex2.connection.disableCNCheck=true


de.heuboe.c2vba.datex2.region.receiver.pullInterval = 60
de.heuboe.c2vba.datex2.region.receiver.pubFileDir = /files/pub

de.heuboe.c2vba.datex2.region.receiver.keyStockReadTimeout = 15

de.heuboe.c2vba.datex2.region.receiver.keepInterval=4


## --------------------------------------------------------------------------
## Actuator
## --------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoints.web.exposure.exclude=shutdown
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true