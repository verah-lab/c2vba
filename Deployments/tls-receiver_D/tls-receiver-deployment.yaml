---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    label.servicename: "tls-receiver_D"
    label.gitversion: "c2vba-tls-receiver_D_2.1.0.0"
    app: tls-receiver
  name: tls-receiver
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tls-receiver
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app: tls-receiver
    spec:
      containers:
      - name: app
        image: heuboe/now/tls-receiver-app-now:1.0.7
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: actuator
          protocol: TCP
        envFrom:
        - secretRef:
            name: application-environment
        env:
        - name: application.name
          value: "tls-receiver"
#        - name: SPRING_PROFILES_ACTIVE
#          value: "default"
        - name: application.instance
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: "info.kubernetes.node.name"
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: "info.kubernetes.pod.name"
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: "info.kubernetes.pod.namespace"
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: "JAVA_TOOL_OPTIONS"
          value: "-XX:MaxRAMPercentage=75"
        volumeMounts:
        - name: config
          mountPath: /config
        livenessProbe:
          failureThreshold: 15
          httpGet:
            path: /actuator/health
            port: actuator
            scheme: HTTP
          initialDelaySeconds: 50
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /actuator/health
            port: actuator
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "1000m"
            memory: 1200Mi
          requests:
            cpu: "250m"
            memory: 700Mi
      volumes:
      - name: config
        configMap:
          name: tls-receiver
