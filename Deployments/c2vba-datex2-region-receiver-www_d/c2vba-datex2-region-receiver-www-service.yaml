    nodePort: 32670
    port: 80
    protocol: TCP
    targetPort: actuator
  - name: mdm-http
    nodePort: 32671
    port: 82
    protocol: TCP
    targetPort: mdm-http
  - name: mdm-https
    nodePort: 32672
    port: 84
    protocol: TCP
    targetPort: mdm-https
  selector:
    app: c2vba-datex2-region-receiver-www
  type: NodePort
