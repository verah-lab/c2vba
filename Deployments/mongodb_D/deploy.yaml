apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo/mongo:4.2
        ports:
        - containerPort: 27017
          protocol: TCP
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: 'heuboeAdmin'
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: 'c2vba'
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        #- name: mongodb-config
        #  mountPath: /etc/mongo/mongod.conf
        #  subPath: mongod.conf
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-data
#      - name: mongodb-config
#        configMap:
#          name: mongodb-config

