apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    label.servicename: "config-service_D"
    label.gitversion: "c2vba-config-service_D_1.17.17.1"
    app: config-service
  name: config-service
  namespace: c2vba
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: config-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: '8080'
        prometheus.io/scrape: 'true'
      creationTimestamp: null
      labels:
        app: config-service
    spec:
      containers:
      - name: app
        image: 'heuboe/vmis2/vmis2-configservice:1.17.17'
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: application-environment
        env:
        - name: application.name
          value: config-service
        - name: application.instance
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: info.kubernetes.node.name
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: info.kubernetes.pod.name
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: info.kubernetes.pod.namespace
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: JAVA_TOOL_OPTIONS
#          value: '-XX:MaxRAMPercentage=75'
          value: '-Xms750m -Xmx750m'
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /actuator/health
            port: actuator
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 5
        ports:
        - containerPort: 8080
          name: actuator
          protocol: TCP
        - containerPort: 9090
          name: grpc
          protocol: TCP
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /actuator/health
            port: actuator
            scheme: HTTP
          initialDelaySeconds: 80
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 1000Mi
          requests:
            cpu: 200m
            memory: 1000Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
          - mountPath: /config
            name: config
      volumes:
        - configMap:
            defaultMode: 420
            name: config-service
          name: config
