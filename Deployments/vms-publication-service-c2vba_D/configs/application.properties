server.port=8080


## VMS SOAP service parameter
de.heuboe.datex2.vms.service.servicePort=8083
de.heuboe.datex2.vms.service.serviceHost=0.0.0.0


## Database
spring.data.mongodb.uri=mongodb://${MONGODB_AUTHORITY}/datex2VMS?appName=vms-publication-service&authSource=admin
#spring.data.mongodb.uri=mongodb://heuboeAdmin:KoMoDNext@mongodb1.d.uz.komodnext.heuboe.hbintern:27017/vms-datex2?appName=vms-publication-service&authSource=admin


## WLS connection
de.heuboe.datex2.vms.service.wlsUrl=http://wls-project-sdbby.c2vba.svc:82/WebLocationServerSrv?wsdl

de.heuboe.datex2.vms.service.wlsSRID=32632
de.heuboe.datex2.vms.service.aqLocationType=

de.heuboe.datex2.vms.service.useAggregatedAqs=false



## ConfigService
de.heuboe.datex2.vms.service.cfgServiceType=NRW
de.heuboe.datex2.vms.service.siteCfgSvcType=GRPC

# GRPC connection
grpc.client.SiteConfigService.address=dns:///site-config-service:9090
grpc.client.SiteConfigService.maxInboundMessageSize=30000000
grpc.client.SiteConfigService.negotiationType=PLAINTEXT


## Image URLs
de.heuboe.datex2.vms.service.imageUrlPrefix=${IMG-SVC-URL}
de.heuboe.datex2.vms.service.zoomFactor=2.0


# gRPC config service connection
grpc.client.ConfigService.address=dns:///config-service:9090
grpc.client.ConfigService.maxInboundMessageSize=30000000
grpc.client.ConfigService.negotiationType=PLAINTEXT

# SBA sites
#de.heuboe.datex2.vms.service.sbaSites=BY-SBA_A9_Freimann_FR_Berlin,BY-SBA_A9_Freimann_FR_Muenchen




##
## Kafka
##

## Connection
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}

# Consumer ID
spring.kafka.consumer.group-id=vms-publication-service

de.heuboe.datex2.vms.service.topicStellzustand=C2VBA-tlsin-WZGStellzustand
de.heuboe.datex2.vms.service.topicFehler=C2VBA-tlsin-WZGDeFehler

# Default serialization types
spring.kafka.consumer.properties.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.properties.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer


## --------------------------------------------------------------------------
## Actuator
## --------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoints.web.exposure.exclude=shutdown
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true