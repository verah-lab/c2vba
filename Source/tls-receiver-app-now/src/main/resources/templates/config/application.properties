## --------------------------------------------------------------------------
## Spring Kafka
## --------------------------------------------------------------------------

# The Kafka servers to connect to, comma seperated list
spring.kafka.bootstrap-servers=

# The name of the consumer group for kafka.
# This is important because the progress/current index is saved using this name.
# Different applications that listen to kafka HAVE to use different group ids.
spring.kafka.consumer.group-id=theReceiver
spring.kafka.listener.missing-topics-fatal=false

# GRPC ConfigService
grpc.client.CfgSvc.address=
grpc.client.CfgSvc.negotiationType=PLAINTEXT

de.heuboe.asfinag.tls.receiver.plugpack=eu.vmis_ehe.vmis2.tls.received.conv
#directory containing the jar file/lib with conversion code
de.heuboe.asfinag.tls.receiver.plugins=/cvtPlugins
# id of UZ as in config service
de.heuboe.asfinag.tls.receiver.uzId=
# pattern for filenames to inspect whether they contain converion code e.g. .*\\.jar
# if used in a docker environment with plugins set to the classpath
#   a more precise pattern is recommended like vmis2-tls-cgl-0.0.7.jar 
de.heuboe.asfinag.tls.receiver.plugJarNameTemplate=

de.heuboe.asfinag.tls.receiver.topicPostfix=
de.heuboe.asfinag.tls.receiver.topicPrefix=

# timezone where tls timestamps operate in
# Europe/Berlin MEZ with daylight saving time
# GMT+01:00 MEZ but always wintertime !needs to be exact!
# UTC ...
de.heuboe.asfinag.tls.receiver.timezoneid=
