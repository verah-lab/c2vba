#
# 1) Remarks
#
# a) The url is only for information, but one should check if it is 'reachable'
#    (<url>?wsdl in a web browser should return the WSDL content of the soap service)
# b) In production environment the available ports are restricted by
#    i)  Firewall configurations 
#    ii) Kubernetes node port definitions (the node ports may differ from the pod ports) 
# 
# 2) Restrictions for consumerMode = PUSH
#
# a) For a single serverPort only one serverSchema shall be used
# b) For a single serverPort different contexts shall be used
#
#
regions:
  region-configs:
    -
      name: vms-nord-srp
      remote: SOAP
      consumerMode: PUSH      
      url: https://mdm-datex2.heuboe.de:4717/datex2/services/supplierPushService-srp-nord
      context: /supplierPushService-srp-nord
      keyStoreType: PKCS12
      keyStoreFile: D:/komodnext/mdm/vms/cert/vzh.heuboe.de.p12
      keyStorePassword: GUChsx5n2S
      serverPort: 4717
      serverDomain: "mdm-datex2.heuboe.de"
      topic: C2VBA-datex2-publication-srp-nord-test
    -
      name: vms-sued-srp
      remote: SOAP      
      consumerMode: PUSH      
      url: https://mdm-datex2.heuboe.de:4717/datex2/services/supplierPushService-srp-sued
      context: /supplierPushService-srp-sued
      keyStoreType: PKCS12
      keyStoreFile: D:/komodnext/mdm/vms/cert/vzh.heuboe.de.p12
