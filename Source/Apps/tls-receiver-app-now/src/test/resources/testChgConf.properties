## +-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-
##
## VMIS2 Kafka Template project
##
## This file only contains default values that are very unlikely to change and
## that are not specific to an environment.
## It is strongly recommended to use the default values of the properties,
## unless you explicitly need different values.
##
## Custom application properties which are meant for externalized configuration 
## are mentioned in /src/main/resources/templates/config/application.properties
## +-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-

## --------------------------------------------------------------------------
## Spring Actuator
## --------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=shutdown
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

## --------------------------------------------------------------------------
## Spring Kafka
## --------------------------------------------------------------------------

# Kafka-Converter
#spring.kafka.consumer.properties.value.deserializer=de.heuboe.vmis2.servicetemplate.config.HeuBoeJsonDeserializer
#spring.kafka.producer.properties.value.serializer=de.heuboe.vmis2.servicetemplate.config.HeuBoeJsonSerializer
#spring.kafka.consumer.properties.spring.json.trusted.packages=de.heuboe.vmis2.servicetemplate.mongo

spring.kafka.consumer.properties.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.properties.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# The Kafka servers to connect to, comma seperated list

# use embedded kafka
#spring.kafka.bootstrap-servers=172.31.246.7:9092,172.31.246.8:9092,172.31.246.9:9092

# The name of the consumer group for kafka.
# This is important because the progress/current index is saved using this name.
# Different applications that listen to kafka HAVE to use different group ids.
spring.kafka.consumer.group-id=tls_sender_Test
spring.kafka.listener.missing-topics-fatal=false

# GRPC ConfigService
#grpc.client.CfgSvc.address=static://oper-w7v.heuboe.hbintern:9890
grpc.client.CfgSvc.address=static://172.31.246.1:31100
grpc.client.CfgSvc.negotiationType=PLAINTEXT

#de.heuboe.tls.sender.config.topicPrefix=UZKTN_
de.heuboe.tls.sender.config.topicPrefix=
de.heuboe.tls.sender.config.topicPostfix=
de.heuboe.tls.sender.config.topicSendTelegram=TlsTele2Send

de.heuboe.tls.sender.config.kosTestMode=true
de.heuboe.tls.sender.config.kosResponseTimeout=120000
de.heuboe.tls.sender.config.kosResponseRetries=0

#de.heuboe.tls.sender.config.configFile=src/test/resources/Sendescript Entwurf.txt
de.heuboe.tls.sender.config.configFile=src/test/resources/send-fg-all.txt

de.heuboe.tls.sender.config.packerInitTimeout=8000
de.heuboe.tls.sender.config.packerTimeout=50

de.heuboe.tls.sender.config.jobNrMin=1
de.heuboe.tls.sender.config.jobNrMax=200

# Properties for communcation status, commState (Kommunikationsstatus)
#
# topic name for communication state
de.heuboe.tls.sender.config.topicCommState=SYSFehlerDUE
# evaluation according to following order (first true wins)
# don't consider the state in SYSFehlerDUE. Assume any node to be alive
de.heuboe.tls.sender.config.forceAlive=false
# when there is no data in SYSFehlerDUE for any node, assume them to be alive    
de.heuboe.tls.sender.config.aliveWhenNoData=true
# when there is no data in SYSFehlerDUE for any node, assume them to be dead
de.heuboe.tls.sender.config.deadWhenNoData=false
# when there is no data in SYSFehlerDUE for any node, assume them to be route dead 
de.heuboe.tls.sender.config.routeDeadWhenNoData=false

de.heuboe.tls.sender.config.timezone4Sync=GMT+01:00
de.heuboe.tls.sender.config.useDstBit=false


#this property can control Kafka if the according bean is named 'changeTopic'
#see CfgChgDetectorConfig # 13 // @ConditionalOnProperty( name="de.heuboe.tls.config.changetopic", matchIfMissing = false )
#a.w.a # 17 // @Bean(name = "changeTopic")
de.heuboe.tls.config.changetopic=WIE-ConfigSrv-DataChange
de.heuboe.tls.config.changetopicgroupid=testChangeDetectorGrpId

# The name of the application shown in the message management system.
de.heuboe.tls.receiver.config.alarm.manager.eventSource=TLS-Sender
# The group id that will be used for the alarm message if an object reference exists.
de.heuboe.tls.receiver.config.alarm.manager.groupId=5000
# The group id that will be used for the alarm message if no object reference exists.
de.heuboe.tls.receiver.config.alarm.manager.groupIdWithoutObjectReference=5002
# The topic the alarm message should be sent to.
de.heuboe.tls.receiver.config.alarm.manager.topic=WIE-AlarmMessage

spring.profiles.active=chg_conf

de.heuboe.tls.sender.config.uzId=WIE

# The name of the consumer group for kafka.
# This is important because the progress/current index is saved using this name.
# Different applications that listen to kafka HAVE to use different group ids.
spring.kafka.consumer.group-id=rn_test_tls_receiver_20190708_1724
spring.kafka.listener.missing-topics-fatal=false

# Spring-Converter
# has to be this way for our use of kafka
spring.kafka.consumer.properties.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.properties.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# GRPC ConfigService
#grpc.client.CfgSvc.address=static://oper-w7v.heuboe.hbintern:9890
# stable
#grpc.client.CfgSvc.address=static://172.31.246.1:31100
# staging
#grpc.client.CfgSvc.address=static://172.31.246.1:31103
#grpc.client.CfgSvc.negotiationType=PLAINTEXT

de.heuboe.asfinag.tls.receiver.plugins=cvtPlugins
de.heuboe.asfinag.tls.receiver.plugJarNameTemplate=.*\\.jar
de.heuboe.asfinag.tls.receiver.plugpack=eu.vmis_ehe.vmis2.tls.received.conv
de.heuboe.asfinag.tls.receiver.uzId=WIE

de.heuboe.asfinag.tls.receiver.topicPostfix=_postfix
de.heuboe.asfinag.tls.receiver.topicPrefix=WIE
de.heuboe.asfinag.tls.receiver.inputTopic=WIE-tlsin-TeleReceived

de.heuboe.tls.receiver.config.chg.changetopic=WIE-ConfigSrv-DataChange
de.heuboe.tls.receiver.config.chg.changetopicgroupid=tlsSendChangeDetectorGrpId

# timezone where tls timestamps operate in
# Europe/Berlin MEZ with daylight saving time
# GMT+01:00 MEZ but always wintertime !needs to be exact!
# UTC ...
de.heuboe.asfinag.tls.receiver.timezoneid=UTC
