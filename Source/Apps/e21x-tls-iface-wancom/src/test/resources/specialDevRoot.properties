## +-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-
##
## VMIS2-gRPC-Template-Project
##
## This file only contains default values that are very unlikely to change and
## that are not specific to an environment.
## It is strongly recommended to use the default values of the properties,
## unless you explicitly need different values.
##
## Custom application properties which are meant for externalized configuration
## are mentioned in /src/main/resources/templates/config/application.properties
## +-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-

## Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=shutdown
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Spring-Converter
# has to be this way for our use of kafka
spring.kafka.consumer.properties.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.properties.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

spring.kafka.consumer.group-id=rn_test_tls_receiver_20190708_1724
spring.kafka.listener.missing-topics-fatal=false

# The Kafka servers to connect to, comma seperated list
#spring.kafka.bootstrap-servers=172.31.246.7:9092
spring.kafka.bootstrap-servers=localhost:9092

# The name of the consumer group for kafka.
# This is important because the progress/current index is saved using this name.
# Different applications that listen to kafka HAVE to use different group ids.
spring.kafka.consumer.group-id=rn_iface_test

de.heuboe.tls.ifacewancom.config.specialDevRoot=aggregatorParent, aggregatorParentId, aggregatorParentCable, 1203, 203, 1

de.heuboe.tls.ifacewancom.config.uzId=UZ_Kaernten
de.heuboe.tls.ifacewancom.config.ifaceKey=2000
de.heuboe.tls.ifacewancom.config.rcvTopic=TeleSReceived
de.heuboe.tls.ifacewancom.config.sndTopic=TeleSToSend-PROP

de.heuboe.tls.ifacewancom.config.chg.changetopic=WIE-ConfigSrv-DataChange
de.heuboe.tls.ifacewancom.config.chg.changetopicgroupid=ifaceWanComTestGroupId

de.heuboe.tls.ifacewancom.config.commStateTopic=TLSCommState
de.heuboe.tls.ifacewancom.config.configFileWANCom=config/kbt.cfg

de.heuboe.tls.ifacewancom.config.minJobNr=1
de.heuboe.tls.ifacewancom.config.maxJobNr=255
de.heuboe.tls.ifacewancom.config.checkLimits=true

de.heuboe.tls.ifacewancom.config.timezone4Sync=GMT+01:00
de.heuboe.tls.ifacewancom.config.useDstBit=false

# spring metrics - tomcat
server.port=8097

log4j.configuration_tmp_File=log4j2.xml

