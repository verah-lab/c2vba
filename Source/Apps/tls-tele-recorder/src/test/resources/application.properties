## --------------------------------------------------------------------------
## Spring Actuator
## --------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=shutdown
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true


## --------------------------------------------------------------------------
## Spring Kafka
## --------------------------------------------------------------------------
spring.kafka.consumer.properties.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.properties.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer


## --------------------------------------------------------------------------
## Tele recorder configuration
## --------------------------------------------------------------------------
tls.tele.recorder.receiveTopic=TeleSReceived
tls.tele.recorder.sendTopic=TeleToSend
tls.tele.recorder.absolutTelegramPath=
# count of telegrams that should be kept (0 means unlimited telegram files)
tls.tele.recorder.cleanTelegrams=0
tls.tele.recorder.server.path.readTelegrams=read
tls.tele.recorder.server.path.streamTelegrams=stream
