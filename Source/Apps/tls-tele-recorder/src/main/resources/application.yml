## --------------------------------------------------------------------------
## Spring Actuator
## --------------------------------------------------------------------------
management:
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        exclude: shutdown
        include: health,info,metrics,prometheus,loggers
  metrics:
    export:
      prometheus:
        enabled: true


## --------------------------------------------------------------------------
## Spring Kafka
## --------------------------------------------------------------------------
spring:
  kafka:
    consumer:
      properties:
        value:
          deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      properties:
        value:
          serializer: org.apache.kafka.common.serialization.ByteArraySerializer
