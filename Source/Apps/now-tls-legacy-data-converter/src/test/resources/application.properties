## --------------------------------------------------------------------------
## Spring Actuator
## --------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=shutdown
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

## --------------------------------------------------------------------------
## Spring Kafka
## --------------------------------------------------------------------------
spring.kafka.consumer.properties.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.properties.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

## --------------------------------------------------------------------------
## Legacy Data Converter configuration
## --------------------------------------------------------------------------
# The name of the topic a config change will be published to.
de.now.tls.legacy.data.converter.config.service.change.topic: NOW-DataChange
# The group id of this service for the config change topic.
de.now.tls.legacy.data.converter.config.service.change.groupId: nowTlsSequencerChangeDetectorGrpId

de.now.tls.legacy.data.converter.topic.prefix.receive=A2-tlsin-
de.now.tls.legacy.data.converter.topic.prefix.send=NOW-tlsout-
de.now.tls.legacy.data.converter.uzId=uz.Hannover.h.de


## --------------------------------------------------------------------------
## GRPC ConfigService
## --------------------------------------------------------------------------
grpc.client.ConfigService.address=static://k3s.d.ni-marzuz.heuboe.hbintern:31100
grpc.client.ConfigService.negotiationType=PLAINTEXT
