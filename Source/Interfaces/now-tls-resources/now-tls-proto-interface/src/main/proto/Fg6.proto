message VLTDeFehler { // Fg 6 | Id 1 | deTyp 1
    option (.heuboe.protobuf.stereotype) = ENTITY;
    string id = 1;
    sint32 jobnummer = 2;
    google.protobuf.Timestamp tls_time = 3; // Zeit die via TLS-Zeitstempel (DE-Nummer 255) mitgesendet wurde
    google.protobuf.Timestamp process_time = 4; // Zeit, zu der die Daten im tls-receiver erstellt wurden.
    sint32 fehlercode = 11;
    sint32 hersteller = 12;
}

message VLTDeFehlerList { // Liste von VLTDeFehler
    option (.heuboe.protobuf.stereotype) = CONTAINER;
    string iid = 1;
    repeated VLTDeFehler elements = 2;
}

