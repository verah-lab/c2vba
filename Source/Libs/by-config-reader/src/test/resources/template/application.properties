# Da diese Infos nicht in den Zulieferungen steht, werden die hier definiert
de.heuboe.by.config.import.vrzId=VRZ_BY
de.heuboe.by.config.import.vrzKnotenNr=256000
de.heuboe.by.config.import.uzId=C2VBA
de.heuboe.by.config.import.uzKnotenNr=256011

# Die beiden sind in dem Konfig GIT Projekt
# Da in den Zulieferungen keine KRIs enthalten sind haben wir hier noch eine Mappingtabelle mit den KRIs
# Die Datei ist in der Konfiguration (Daten-Projekt, in dem auch die Excel und aufbereiteten Daten liegen) zu finden
de.heuboe.by.config.import.kriFile={KONFIGURATIONSPROJEKT_C2VBA}/Export_20221013_hb.xlsx

# Wir haben in C2VBA WWW-Ketten diese sind in dieser Datei definiert und werden als Gruppe (GRP) mit in den ConfigService importiert
# Die Datei ist in der Konfiguration (Daten-Projekt, in dem auch die Excel und aufbereiteten Daten liegen) zu finden
de.heuboe.by.config.import.wwwDir={KONFIGURATIONSPROJEKT_C2VBA}/www_v1.0.txt

# Address of configservice. Pay attention to correct protocol (e.g. "dns:///") and port (e.g. ":31100")
grpc.client.configService.address=dns:///{WORKER}:31100
grpc.client.configService.negotiationType=PLAINTEXT
