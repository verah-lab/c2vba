##
## VMIS2 Kafka Template
##
## This file provides a list of all custom application properties. The
## properties are listed with a possible default value, a hint which values
## might be allowed and a short description what the properties are used for.
##
## The file is intended as a template for custom property files
## of this application, which are then used in specific environments.
##
## All properties that have no default value or need to be overridden
## can be specified either
##   - within a custom property file ('-Dspring.config.location=file:<path>')
##   - by using system properties (-D<property>=<value>)
##   - application parameters (--<property>=<value>).
##
## See: Spring Boot Reference Guide - Externalized Configuration
## http://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#boot-features-external-config
## +-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-

# The Kafka servers to connect to
#spring.kafka.bootstrap-servers=172.31.246.7:9092,172.31.246.8:9092,172.31.246.9:9092

# The name of the consumer group for kafka.
# This is important because the progress/current index is saved using this name.
# Different applications that listen to kafka HAVE to use different group ids.
spring.kafka.consumer.group-id=EmbeddedKafkaTest
spring.kafka.consumer.topic-pattern=TEST_tls-*

# Whether the consumer's offset is periodically committed in the background (true|false)
#spring.kafka.consumer.enable-auto-commit=

# Listener AckMode (RECORD|BATCH|TIME|COUNT|COUNT_TIME|MANUAL|MANUAL_IMMEDIATE)
# https://docs.spring.io/spring-kafka/docs/2.2.0.RELEASE/reference/html/_reference.html#committing-offsets
#spring.kafka.listener.ack-mode=

# Number of records between offset commits when ackMode is "COUNT" or "COUNT_TIME".
#spring.kafka.listener.ack-count=

# Time between offset commits when ackMode is "TIME" or "COUNT_TIME".
#spring.kafka.listener.ack-time=

# What to do when there is no initial offset in Kafka
# or if the current offset no longer exists on the server (earliest|latest)
#spring.kafka.consumer.auto-offset-reset=

# ID to pass to the Kafka server when making requests. Used for server-side logging.
# If it is omitted, a (meaningless) default value is used with which this application can not be identified.
# It is therefore strongly recommended to set this value (for example to the application name or artifactId).
#spring.kafka.client-id=vmis2-kafka-sequencer-test


## --------------------------------------------------------------------------
## Spring Actuator
## --------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=shutdown
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

## --------------------------------------------------------------------------
## Spring Kafka
## --------------------------------------------------------------------------
spring.kafka.consumer.properties.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.properties.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer


## --------------------------------------------------------------------------
##  Kafka sequencer configuration
## --------------------------------------------------------------------------
de.heuboe.tls.sequencer.config.service.change.topic: WIE-ConfigSrv-DataChange
de.heuboe.tls.sequencer.config.service.change.groupId: testTlsSequencerChangeDetectorGrpId
de.heuboe.tls.sequencer.uzid=WIE
de.heuboe.tls.sequencer.receive.topic.prefix=TEST_tlsin-
de.heuboe.tls.sequencer.receive.topic.suffix=
de.heuboe.tls.sequencer.responseRetries=0
de.heuboe.tls.sequencer.responseTimeout=20000
de.heuboe.tls.sequencer.script.path=src/test/resources/sequences
de.heuboe.tls.sequencer.script.globalScripts=seq-test.txt
de.heuboe.tls.sequencer.script.stageName=TEST
de.heuboe.tls.sequencer.script.systemName=TEST
de.heuboe.tls.sequencer.script.testModePath=
de.heuboe.tls.sequencer.send.topic.prefix=TEST_tlsout-
de.heuboe.tls.sequencer.send.topic.suffix=
de.heuboe.tls.sequencer.header.type=X-Protobuf-Type
de.heuboe.tls.sequencer.header.sequencerContent=modifiedByTestSequencer
de.heuboe.tls.sequencer.header.sequencerMarker=X-Sequencer-Message

