name: pipeline-csharp
trigger:
  tags:
    include:  ['*']

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: VERSION_TAG=`git describe --tags | sed -E 's/^[^_]*_|^v//g'` && echo "##vso[task.setvariable variable=VERSION_TAG]$VERSION_TAG"
  displayName: Set the tag name as an environment variable
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '2.2.207'
- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    arguments: '-p:PackageVersion=$(VERSION_TAG)'
- task: DotNetCoreCLI@2
  inputs:
    command: 'pack'
    versioningScheme: byEnvVar
    versionEnvVar: 'VERSION_TAG'
    packagesToPack: 'protoNuget.csproj'
- bash: |
   #copy proto files
   cp -R vmis2-jprotoc-transferinterface/src/main/proto bin/proto/
   cd bin
   #update nupkg
   ls $(Build.ArtifactStagingDirectory)
   unzip -l $(Build.ArtifactStagingDirectory)/VMIS2.Transfer.Interface.$VERSION_TAG.nupkg
   zip -ur $(Build.ArtifactStagingDirectory)/VMIS2.Transfer.Interface.$VERSION_TAG.nupkg proto
   # cd back
   cd ..
  displayName: 'Add proto Files to nuget'
- task: DotNetCoreCLI@2
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/*.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'VMIS-Nexus'
