syntax = "proto3";

package eu.vmis_ehe.vmis2.control.data;

import "Attribute.proto";
import "CommonControlData.proto";
import "CommonSituationMeasure.proto";
import "ConfigBase.proto";
import "ControlSign.proto";
import "GeoReference.proto";
import "EDBInterface.proto"; //Attributes used for new EDB-Handling
import "google/protobuf/timestamp.proto";
import "heuboe/protobuf/Documentation.proto";
import "heuboe/protobuf/InterfaceVersion.proto";

option java_multiple_files = true;
option java_outer_classname = "MeasureProto";
option csharp_namespace = "eu.vmis_ehe.vmis2.control.data";
option (.heuboe.protobuf.interface_version) = "3.5.1";

// VMIS2-S1ANF-797
// Temporary definition of a simple standardized description of measures
message StandardDescription {
    option (.heuboe.protobuf.stereotype) = DATATYPE;
    string description = 1;
}

// Advances Definition of situation subclass IDs with negation
message SituationSubClassIDs {
    option (.heuboe.protobuf.stereotype) = DATATYPE;
    repeated string situation_sub_class_ids = 1;
    repeated string negation_situation_sub_class_ids = 2;
}

// indicates when a measure has to be approved by an operator
enum MeasureApprovalMode {
    AP_UNSPECIFIED = 0; //due to protobuf styleguide
    NO_APPROVAL = 1; //the measure must not be approved
    APPROVE_ACTIVATION = 2; //the measure must be approved when it should be activated
    APPROVE_DEACTIVATION = 3; //the measure must be approved when it should be deactivated
    APPROVE_BOTH = 4; //the measure must be approved when it should be activated or deactivated
}

enum MeasureOperatingMode {
    OM_UNSPECIFIED = 0; //due to protobuf styleguide
    WAIT_FOR_APPROVAL = 1; //the measure is waiting for approval
    PERMANENT_SUPPRESSED = 2; //the measure should not become active until the operator changes this state
    ONE_TIME_APPROVED = 3; //the current sign setting should become active but changes must be approved
    AUTOMATIC_APPROVED = 4; //changes of the automatic algorithms are approved
    SIGN_SETTING_APPROVED = 5; //the current sign setting is approved. Changes by the automatic algorithms will be suppressed
}

enum SequenceState {
    INITIAL_WAITING = 0;
    ACTIVATION_SEQUENCE_RUNNING =1;
    ACTIVATION_SEQUENCE_FINISHED =2;
    DEACTIVATION_SEQUENCE_RUNNING=3;
    DEACTIVATION_SEQUENCE_FINISHED=4;
}

// Forbids the deletion of a measure
enum MeasureSelectionInstruction {
    DELETION_ALLOWED =0;
    DELETION_FORBIDDEN =1;
}

// VMIS2-S1ANF-562
// Measure class represents one entry in the meassure catalogue
message MeasureClass {
    option (.heuboe.protobuf.stereotype) = ENTITY;
    //approval_requirement has been changed to approval_mode and from boolean to enum
    //logical_operating_mode has been changed to measure_priority_mode
    // was used for user and changed_at, this is know move to catalogue
    reserved 4, 15 to 16, 23 to 24;
//    reserved 15 to 16;
//    reserved 23 to 24;
    enum LogicalOperation {
        OR = 0; // Logical OR operation
        AND = 1; // Logical AND operation
    }  
    TwoPartIdentification two_part_id = 1;                          // Unique two-part identification of a measure class                          
    string display_name = 2;                                        // Display name
    string description = 3;                                         // Decription of the measure class
//    Timespec validity_timespec = 4 [(.heuboe.protobuf.required) = false];  // Time specification for the validity of the measure class
    // If a time specification and situations are assigned to a
    // measure, it must be determined whether all situation
    // objects and related situations are present and the time
    // specification is valid (logical AND operation) or whether
    // the situations are  present or the time specification
    // exists and is valid(logical OR operation).                         
    LogicalOperation evaluation_timespec = 5;                            
    SituationSubClassIDs situation_sub_classes = 6;                 // Related sub class ids
    // If several situations are assigned to a measure, it must
    // be determined whether all situation objects of all
    // situations must be present for the creation of a
    // corresponding measure object(logical AND operation) or
    // whether the measure is triggered (logical OR operation)
    // if only one situation object exists                 
    LogicalOperation evaluation_sub_classes = 7;                        
    repeated ValiditySection sections_of_use = 8;                   // if empty:all, if not:only these areas
    repeated ValiditySection sections_of_not_use = 9;               // if not empty subtract these areas
    // List of measurekey(s): if the following measures have a
    // common validity area they must be completely ignored
    repeated string complete_eliminate_measures = 10;
    // List of measurekey(s): If the following measures have a
    // common validity area, the valid area must be clipped 
    repeated string cutting_valid_sections_measures = 11;               
    string stVO_paragraph = 12;                                     // StVO-Paragraph
    repeated string attribute_class = 13;                           // Additional attribute types
    StandardDescription standard_description = 14  [(.heuboe.protobuf.required) = false]; // Standardized description of measures
    // Logical operating mode
    MeasurePriorityModeWrapper.MeasurePriorityMode  measure_priority_mode = 25;
    // Mode if and how a measure must be approved before it is considered in sign request preparation
    MeasureApprovalMode approval_mode = 22;
    // True, if the operator is able to change measure objects
    // of this measure (class) - (VM2-26099)
    bool changeable = 17;  
    // Properties of lifecycle algorithm for measures of that class                                                
    LifecycleProperties lifecycle = 18;                             
    // True, if the main funnel of the default sign of the measure,  
    // should be placed to the down stream display panel.
    bool down_stream_main_funnel = 19;
    string measure_category = 20;                                   // measure category to group measures.
    // True, if operator is able to create measures of this class (VM2-26099)
    bool manual_handling = 21;
    int32 shifting_value = 26; //default 0
    //listing the areas which have a special shifting value
    repeated ShiftingAreas shifting_areas = 27;
    // Time specification for the validity of the measure class in ical RFC-2445 format.
    string recurrent_validity_timespec = 28 [(.heuboe.protobuf.required) = false];
    //should measure selection run for this measure class
    bool measure_selection_active = 29;
    // array of time specifications for the validity of the measure class; each in ical RFC-2445 format.
    repeated string recurrent_validity_timespecs = 30 [(.heuboe.protobuf.required) = false];
    // US-23977
    // false: validity of recurrent_validity_timespecs is wanted only when day has valid event (validity_timespec_event_definition_id)
    // true: validity of recurrent_validity_timespecs is wanted only when day has not valid event (validity_timespec_event_definition_id)
    bool validity_timespec_event_negation = 31;
    // US-23977
    // id of event which has to be valid or not (see validity_timespec_event_negation) to fulfill recurrent_validity_timespecs
    string validity_timespec_event_definition_id = 32 [(.heuboe.protobuf.required) = false];
}

// VMIS2-S1ANF-805
message ShiftingAreas {
    option (.heuboe.protobuf.stereotype) = DATATYPE;
    int32 d = 1; // d stands for the shifting value in metre for a measure of this measure class type
    ValiditySection valSec = 2;
}

// VMIS2-S1ANF-570
// Measure catalogue lists all measures in priority sequence. 
// (the first is the most important)
message MeasureCatalogue {
    option (.heuboe.protobuf.stereotype) = CONTAINER;
    repeated MeasureClass measure_classes = 1;      // List of measures
    string iid = 2;                                 // message id
    string user = 3; // user who changed values.
    google.protobuf.Timestamp changed_at = 4; // timestamp at the user changed something
    string comment = 5; // comment of user what was changed values.
}

// Release state for measures requiring release
message ReleaseStateWrapper {
    option (.heuboe.protobuf.stereotype) = DATATYPE;
    enum ReleaseState {
        NOT_RELEASED = 0;
        RELEASED = 1;
    }
}

// VMIS2-S1ANF-165
// VMIS2-S1ANF-629
// VMIS2-S1ANF-800: Change: "Manuelle Eingriffe Teil1"
// Attributes of manual measure objects or changeable measure objects
message ManChangeableMeasure {
    option (.heuboe.protobuf.stereotype) = DATATYPE;
    reserved 2, 3; //comment was removed. ReleaseState was removed here
    string name = 1; // Creator of the measure
    string legal_basis = 5; //STVO Paragraph inherited from the MeasureClass
    string issuer = 6; //issuer of the legal base (organisation and contact)
}

// VMIS2-S1ANF-569
message DisplacedMeasure {
    option (.heuboe.protobuf.stereotype) = DATATYPE;
    enum DisplacedType {
        // If measure objects exlcude spatially, then the lower-level
        // measure object is clipped in the spatial overlap area. 
        EXCLUDE_SPATIALLY = 0;
        // If measure objects are completely excluded, then the
        // lower-level measure object is completely removed and not
        // considered further for the further calculation steps if there
        // is a spatial overlap 
        EXCLUDE_COMPLETELY = 1;
        // If measures objects are allowed to overlap, then these
        // measures may exist simultaneously and will neither be clipped
        // nor completely removed.
        MAY_OVERLAP = 2;
    }
    TwoPartIdentification meausre_two_part_id = 1 [(.heuboe.protobuf.extRef) = 
        { type: "eu.vmis_ehe.vmis2.control.data.Measure", field: "two_part_id" }];
    DisplacedType displaced_type = 2;
}

// VMIS2-S1ANF-561
// VMIS2-S1ANF-569
// Attributes of the measure objects after measure selection or
// attributes of merged measure objects
message Measure {

    option (.heuboe.protobuf.stereotype) = ENTITY;

    reserved 10,11, 12, 13; //10 source has been replaced over fix attributes.
                            //11 source_system_id has been replaced over fix attributes.
                            //12 approval_requirement has been changed to approval_mode and from boolean to enum
                            //13 ManApprovalMeasure has been change to ManChangeableMeasure
    // The point in time when an event or data record occurred,
    // i.e. was originally created "at the source". Contains
    // e.g. the interval time stamp of input values or 
    // aggregation time of the measure 
    google.protobuf.Timestamp event_time = 1;
    // Processing time - The point in time when the event or data  
    // record happens to be processed by the processing application, i.e.
    // when the record is being consumed. The processing time may be 
    // milliseconds, hours, or days etc. later than the original event time. 
    // This is something like setting a system_time from the database in old 
    // systems
    google.protobuf.Timestamp processing_time = 2;  
    TwoPartIdentification two_part_id = 3;                  // Unique two-part identification of a measure object
    string description = 4;                                 // Description/explanation of the measure object
    // Unique two-part identification of the associated  
    // measure class (VMIS2-S1ANF-562) 
    TwoPartIdentification measure_class_two_part_id = 5 [(.heuboe.protobuf.extRef) = 
        { type: "eu.vmis_ehe.vmis2.control.data.MeasureClass", field: "two_part_id" }];
    // Logical operating mode (MeasureClass)
    MeasurePriorityModeWrapper.MeasurePriorityMode measure_priority_mode = 6;
    // Time specification for the validity of the AUTOMATIC measure object (for manual use recurrent_validity_timespecs (29))
    Timespec validity_timespec = 7 [(.heuboe.protobuf.required) = false];
    repeated ValiditySection validity_sections = 8;         // Area of validity
    // Unique two-part identification of situation objects (cause of measure objects)
    repeated TwoPartIdentification situation_two_part_ids = 9 [(.heuboe.protobuf.extRef) = 
        { type: "eu.vmis_ehe.vmis2.control.data.Situation", field: "two_part_id" }];

    // Manual operations

    // 21,22,23 are changed through the change requirement VMIS2-S1ANF-561 and the Change "Manuelle Eingriffe Teil1"
    // Current state of the measure (ACTIVE or INACTIVE)
    MeasureState measure_state = 21;
    // Mode if and how a measure must be approved before it is considered in sign request preparation
    MeasureApprovalMode approval_mode = 22;
    // Current operating mode of the measure
    MeasureOperatingMode operating_mode = 23;

    // Additional attributes for a manual measure or a 
    // measuremeasure requiring approval
    ManChangeableMeasure manual_changeable_measure = 24 [(.heuboe.protobuf.required) = false];
    StandardDescription standard_description = 14 [(.heuboe.protobuf.required) = false]; // Optional standardized description of measures
    repeated Attribute attributes = 15; // Optional additional attributes
    // Displaced measures with displaced classification
    // (DisplacedType)
    repeated DisplacedMeasure displacedMeasures = 16;
    // Displaced from Measure with displaced classification
    // (DisplacedType)
    repeated DisplacedMeasure displacedFromMeasures = 25;
    // Original area of validity
    repeated ValiditySection original_validity_sections = 17;
    EDBAttributes edb_attributes = 20 [(.heuboe.protobuf.required) = false]; // edb attributes for new EDB-Handling.
    // fix attributes to get information source system
    repeated FixAttributes fix_attributes =26;
    //flag for deleted measures
    bool deleted = 27;
    // number to increment if twoPartId.iterationId is changing
    int32 sequential_number = 28;
    // array of time specifications for the validity of the MANUAL measure object; each in ical RFC-2445 format.
    // (for automatic use validity_timespec (7))
    repeated string recurrent_validity_timespecs = 29 [(.heuboe.protobuf.required) = false];

    MeasureType measure_type = 30;  // Type of measure
    // flag if measure was created in autarky or not
    bool autarky = 31;
    // US-23977
    // false: validity of recurrent_validity_timespecs is wanted only when day has valid event (validity_timespec_event_definition_id)
    // true: validity of recurrent_validity_timespecs is wanted only when day has not valid event (validity_timespec_event_definition_id)
    bool validity_timespec_event_negation = 32;
    // US-23977
    // id of event which has to be valid or not (see validity_timespec_event_negation) to fulfill recurrent_validity_timespecs
    string validity_timespec_event_definition_id = 33 [(.heuboe.protobuf.required) = false];
    // to modify measure behaviour
    ModifyMeasure modifyMeasure = 34;
    // list of referenced lane positions (information of closed lanes to set DLS in previous funnel)
    repeated configservice.LanePos lane_reference = 35  [(.heuboe.protobuf.required) = false];
}

// List of Measures used e.g. to publish Situations to a broker etc. 
message Measures {
    option (.heuboe.protobuf.stereotype) = CONTAINER;
    repeated Measure measures = 1; // List of Measures
    string iid = 2; // message id
}

// operator's panel content correction
message PanelContentCorrection{
    option (.heuboe.protobuf.stereotype) = DATATYPE;
    // true if operator demand in devicePanelContent is active.
    // depends on MeasureOperatingMode (3, 5 = true; 2,4 = false)
    bool adjustment_active = 1;
    bool operator_adjusted = 2; // true if operator has changed proposal of sign-preperation

    VersionedDevicePanelContent devicePanelContent = 3;     // panel content
}

// measure with content correction (Manual operations)
message MeasureAndPanelContentCorrection {
    option (.heuboe.protobuf.stereotype) = ENTITY;
    Measure measure = 1;                    // measure
    // panel correction only necessary for manual operations
    PanelContentCorrection panelContentCorrection = 2 [(.heuboe.protobuf.required) = false];
}

// List of adjusted Measures used e.g. to publish Situations to a broker etc.
message MeasuresAdjusted {
    option (.heuboe.protobuf.stereotype) = CONTAINER;
    string iid = 1; // message id
    repeated MeasureAndPanelContentCorrection measuresandcorrections = 2; // List of Measures
}

// Measure that shouldn't be taken into account while determining control signs
message SuppressedMeasure {
    option (.heuboe.protobuf.stereotype) = ENTITY;
    // object id of measure to suppress
    string id = 1 [(.heuboe.protobuf.extRef) = { type: "eu.vmis_ehe.vmis2.control.data.Measure", field: "~two_part_id.obj_id"
                  }];
    google.protobuf.Timestamp time = 2; // timestamp when measure was set to suppressed
    string user = 3; // user who suppressed the measure
    bool active = 4; // flag if measure should be suppressed or not
    string iid = 5; // message id - TODO: extract like Measure-message
}

message MeasureSequenceState {
    option (.heuboe.protobuf.stereotype) = ENTITY;

    string iid = 1;			// messageID
    string id = 2;			// ID of measure
    google.protobuf.Timestamp time = 3; // Zeitpunkt der letzten �nderung

    int32 stepAbsoluteTime = 4;       // Number of the last started sequence
    int32 stepCount = 5;              // consecutive number of processed step
    SequenceState sequenceState = 6;   // recent state
    MeasureSelectionInstruction measureSelectionInstruction = 7;   // forbid deletion

    DevicePanelContentSequence devicePanelContentSequence = 8; // progression

    string measure_class_id = 9;                                // measure class id

    repeated ValiditySection validity_sections = 10;         // measure validity sections
}

// Measure with its ControlSignMeasure
message MeasureAndControlSign {
    option (.heuboe.protobuf.stereotype) = CONTAINER;
    Measure measure = 1;
    ControlSignMeasure controlSignMeasure = 2;
}

// List of Measures together with ControlSignMeasures
message MeasuresAndControlSigns {
    option (.heuboe.protobuf.stereotype) = CONTAINER;
    string iid = 1; // message id
    repeated MeasureAndControlSign measuresAndControlSigns = 2; // List of Measures and ControlSigns
}
