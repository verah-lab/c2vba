syntax = "proto3";

package de.heuboe.asfinag.kafka.data;

import "heuboe/protobuf/InterfaceVersion.proto";

option java_multiple_files = true;
option java_outer_classname = "SampleProtoDDC";
option (.heuboe.protobuf.interface_version) = "2.0.0";

message SampleProto {

	sint64 id = 1 ;
	string name = 2 ;
	repeated string tag = 3;
	string iid = 4;

}
