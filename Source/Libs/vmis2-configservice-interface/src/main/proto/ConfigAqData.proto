        END_RECOMMENDED_SPEED_140_KMH = 150;
        END_RECOMMENDED_SPEED_130_KMH = 151;

        reserved 152 to 214;

        ADD_TEXT_NEXT_1700M = 215;
        ADD_TEXT_NEXT_1800M = 216;
        ADD_TEXT_NEXT_1900M = 217;
        ADD_TEXT_NEXT_2100M = 218;

        reserved 219 to 224;

        ADD_TEXT_3_5T = 225;
        ADD_TEXT_DISTANCE = 226;
        ADD_TEXT_WRONG_WAY_DRIVER = 227;
        ADD_TEXT_SLIPPERINESS_RISK = 228;
        ADD_TEXT_SLIPPERINESS = 229;
        ADD_TEXT_IG_LUFT = 230;
        ADD_TEXT_SPOT_CHECK = 231;
        ADD_TEXT_OIL_SPILL = 232;
        ADD_TEXT_BREAKDOWN = 233;
        ADD_TEXT_CROSSWIND = 234;
        ADD_TEXT_TUNNEL_CLOSED = 235;
        ADD_TEXT_DETOUR = 236;

        reserved 237 to 240;

        PRISM_1 = 241;
        PRISM_2 = 242;
        PRISM_3 = 243;
        PRISM_4 = 244;

        reserved 245 to 255;
    }

    int32 code = 1;                                 // This particular symbol's code, must be unique for one WZG

    oneof name {                                    // Symbol's name, either
        TrafficSignificance significance = 2;       //  a traffic relevant constant, or
        string plaintext = 3;                       //  a simple text (for custom symbols)
    }

    int32 blink_frequency = 4 [(.heuboe.protobuf.required) = false];            // Optional, for WVZs that should blink by default

    repeated WzgSymbol components = 10[(.heuboe.protobuf.required) = false];    // Optional, E_type WZGs only: Component symbols for this 'program's code
}

// WZG font definition (for WZGs that can display arbitrary text)
message WzgFont {
    option (.heuboe.protobuf.stereotype) = DATATYPE;

    string id = 1;
    string name = 2;
}

// Component program definition: A named list of symbol codes for an E-type WZG group's list of components,
// with one symbol for each of WZG's component, ordered like those components
message CmpProgram {
    option (.heuboe.protobuf.stereotype) = DATATYPE;

    string id = 1;
    string name = 2;
    repeated CmpCode codes = 3;                     // Codes for WZG's components
}
message CmpCode {
    option (.heuboe.protobuf.stereotype) = DATATYPE;

    string component_id = 1;                        //
    int32 symbol_code = 2;                          //
}
