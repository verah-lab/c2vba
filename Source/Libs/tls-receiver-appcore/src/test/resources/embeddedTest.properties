## +-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-
##
## VMIS2 Kafka Template
##
## This file provides a list of all custom application properties. The 
## properties are listed with a possible default value, a hint which values
## might be allowed and a short description what the properties are used for.
##
## The file is intended as a template for custom property files 
## of this application, which are then used in specific environments.
##
## All properties that have no default value or need to be overridden
## can be specified either
##   - within a custom property file ('-Dspring.config.location=file:<path>')
##   - by using system properties (-D<property>=<value>) 
##   - application parameters (--<property>=<value>).
##
## See: Spring Boot Reference Guide - Externalized Configuration 
## http://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#boot-features-external-config
## +-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-

## --------------------------------------------------------------------------
## Spring Actuator
## --------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=shutdown
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

## --------------------------------------------------------------------------
## Spring Kafka
## --------------------------------------------------------------------------

# The Kafka servers to connect to, comma seperated list
#spring.kafka.bootstrap-servers=localhost:9092

# Whether the consumer's offset is periodically committed in the background (true|false)
#spring.kafka.consumer.enable-auto-commit=

# Listener AckMode (RECORD|BATCH|TIME|COUNT|COUNT_TIME|MANUAL|MANUAL_IMMEDIATE)
# https://docs.spring.io/spring-kafka/docs/2.2.0.RELEASE/reference/html/_reference.html#committing-offsets
#spring.kafka.listener.ack-mode=

# Number of records between offset commits when ackMode is "COUNT" or "COUNT_TIME".
#spring.kafka.listener.ack-count=

# Time between offset commits when ackMode is "TIME" or "COUNT_TIME".
#spring.kafka.listener.ack-time=

# What to do when there is no initial offset in Kafka 
# or if the current offset no longer exists on the server (earliest|latest)
#spring.kafka.consumer.auto-offset-reset=

# The name of the consumer group for kafka.
# This is important because the progress/current index is saved using this name.
# Different applications that listen to kafka HAVE to use different group ids.
spring.kafka.consumer.group-id=rn_test_tls_receiver_20190708_1724
spring.kafka.listener.missing-topics-fatal=false

# Spring-Converter
# has to be this way for our use of kafka
spring.kafka.consumer.properties.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.properties.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# GRPC ConfigService
#grpc.client.CfgSvc.address=static://oper-w7v.heuboe.hbintern:9890
# stable
#grpc.client.CfgSvc.address=static://172.31.246.1:31100
# staging
grpc.client.CfgSvc.address=static://172.31.246.1:31103
grpc.client.CfgSvc.negotiationType=PLAINTEXT

de.heuboe.asfinag.tls.receiver.plugins=cvtPlugins
de.heuboe.asfinag.tls.receiver.plugJarNameTemplate=.*\\.jar
de.heuboe.asfinag.tls.receiver.plugpack=eu.vmis_ehe.vmis2.tls.received.conv
#de.heuboe.asfinag.tls.receiver.uzId=UZ_Kaernten
de.heuboe.asfinag.tls.receiver.uzId=UZ_A2

de.heuboe.asfinag.tls.receiver.topicPostfix=
de.heuboe.asfinag.tls.receiver.topicPrefix=A2_

de.heuboe.tls.receiver.config.chg.changetopic=WIE-ConfigSrv-DataChange
de.heuboe.tls.receiver.config.chg.changetopicgroupid=tlsSendChangeDetectorGrpId

# The name of the application shown in the message management system.
de.heuboe.tls.receiver.config.alarm.manager.eventSource=TLS-Sender
# The group id that will be used for the alarm message if an object reference exists.
de.heuboe.tls.receiver.config.alarm.manager.groupId=5000
# The group id that will be used for the alarm message if no object reference exists.
de.heuboe.tls.receiver.config.alarm.manager.groupIdWithoutObjectReference=5002
# The topic the alarm message should be sent to.
de.heuboe.tls.receiver.config.alarm.manager.topic=WIE-AlarmMessage

# for a limited time:
de.heuboe.asfinag.tls.receiver.floatInvalid=-99999

# timezone where tls timestamps operate in
# Europe/Berlin MEZ with daylight saving time
# GMT+01:00 MEZ but always wintertime !needs to be exact!
# UTC ...
de.heuboe.asfinag.tls.receiver.timezoneid=GMT+01:00
de.heuboe.asfinag.tls.receiver.timetolerance=30

# optional fake timestamp format: IntervallArt:IntervallLaenge // Fg 1 Type 48 TLS 2013
de.heuboe.asfinag.tls.receiver.intervallArtLaenge=1:4

# spring metrics - tomcat
server.port=8089
