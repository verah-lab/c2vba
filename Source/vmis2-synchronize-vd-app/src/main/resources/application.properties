## +-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-
## Application properties
##
## This file provides a list of all application properties.
##
## Some properties are preset with default values which will be taken
## unless they are overridden.
##
## All properties that have no default value or need to be overridden
## can be specified either
##   - within a custom property file ('-Dspring.config.location=file:<path>')
##   - by using system properties (-D<property>=<value>)
##   - application parameters (--<property>=<value>).
##
## See: Spring Boot Reference Guide - Externalized Configuration
## http://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#boot-features-external-config
## +-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-


## +-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-
##
## VMIS2 Kafka Template project
##
## This file only contains default values that are very unlikely to change and
## that are not specific to an environment.
## It is strongly recommended to use the default values of the properties,
## unless you explicitly need different values.
##
## Custom application properties which are meant for externalized configuration
## are mentioned in /src/main/resources/templates/config/application.properties
## +-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-
#server.port=8077 keep default for docker/kubernetes
## --------------------------------------------------------------------------
## Spring Actuator
## --------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoints.web.exposure.exclude=shutdown
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

## --------------------------------------------------------------------------
## Spring Kafka
## --------------------------------------------------------------------------

# Kafka-Converter
#spring.kafka.consumer.properties.value.deserializer=de.heuboe.vmis2.servicetemplate.config.HeuBoeJsonDeserializer
#spring.kafka.producer.properties.value.serializer=de.heuboe.vmis2.servicetemplate.config.HeuBoeJsonSerializer
#spring.kafka.consumer.properties.spring.json.trusted.packages=de.heuboe.vmis2.servicetemplate.mongo
# Spring-Converter
spring.kafka.consumer.properties.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.properties.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
